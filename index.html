<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./js/templates.js"></script>
    <script src="./js/autocomplete.js"></script>
    <script src="./js/script.js"></script>
</head>

<body onload="init()">
    <header id="header">
        <div class="header-banner">
            <h1 class="headline">Pokédex</h1>
            <nav>
                <form autocomplete="off" class="search-bar" onsubmit="filterPokemon(); return false">
                    <button class="search-btn btn" type="submit" title="Search">
                        <img src="icons/arrowright.png" alt="Search">
                    </button>
                    <input type="text" id="search-input" class="search-input" placeholder="Search Pokémon..." minlength="3" required>
                </form>
                <div class="nav-actions">
                    <button class="home-btn btn" onclick="home()" title="Home">
                        <img src="icons/home.png" alt="Home">
                    </button>
                    <button class="show-favorites-btn btn" onclick="showFavoritePokemon()" title="Favorites">
                        <img src="icons/favorit.png" alt="Favorites">
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <div id="pokemon-details-container" class="pokemon-details-container d-none" onclick="closePokemonDetails()"></div>

    <main id="pokedex-render-container" class="pokedex-render-container"></main>

    <div class="loading-screen d-none" id="loading-screen">
        <div class="loading-card">
            <img src="icons/arrowdown.png" alt="Loading" class="loader-icon">
            <h2 class="loading-screen-headline">Catching Pokémon...</h2>
            <p class="loading-screen-text">Please wait a moment...</p>
        </div>
    </div>
</body>

</html>
